name: Evaluate Safe Rust VM Core candidate

on:
  push:
    branches:
      - audit/agent-safe-rust-vm-core
  pull_request:
    paths:
      - 'src/vm/**'
      - 'src/lib.rs'
      - 'tests/vm_core_tests.rs'
      - 'tests/vm_core_audit_tests.rs'
      - '.github/workflows/safe-rust-vm-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: Check compiler lints
        run: cargo clippy --locked --all-targets -- -D warnings

  tests-debug:
    name: Debug tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Test debug build
        run: cargo test --locked --all-targets

  tests-release:
    name: Release tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Test optimized build
        run: cargo test --locked --release --all-targets
